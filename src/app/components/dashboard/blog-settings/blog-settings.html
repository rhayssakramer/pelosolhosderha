<div class="settings">
  <h1>🎨 Aparência do Blog</h1>

  <form (ngSubmit)="save()" class="settings-form">
    <div class="form-group">
      <label>Título do Blog</label>
      <input type="text" [(ngModel)]="settings.blogTitle" name="blogTitle">
    </div>

    <div class="form-group">
      <label>Descrição</label>
      <input type="text" [(ngModel)]="settings.blogDescription" name="blogDescription">
    </div>

    <div class="form-group">
      <label>Cor Primária</label>
      <div class="color-input">
        <input type="color" [(ngModel)]="settings.primaryColor" name="primaryColor">
        <span>{{ settings.primaryColor }}</span>
      </div>
    </div>

    <div class="form-group">
      <label>Cor de Destaque</label>
      <div class="color-input">
        <input type="color" [(ngModel)]="settings.accentColor" name="accentColor">
        <span>{{ settings.accentColor }}</span>
      </div>
    </div>

    <div class="form-group">
      <label>Fonte</label>
      <select [(ngModel)]="settings.fontFamily" name="fontFamily">
        <option value="Georgia, serif">Georgia (Serif)</option>
        <option value="'Inter', sans-serif">Inter (Sans-serif)</option>
        <option value="'Merriweather', serif">Merriweather (Serif)</option>
        <option value="'Playfair Display', serif">Playfair Display</option>
        <option value="system-ui, sans-serif">System UI</option>
      </select>
    </div>

    <button type="submit" class="btn-save">Salvar Configurações</button>
  </form>

  <div class="preview">
    <h2>Preview</h2>
    <div class="preview-box" [style.font-family]="settings.fontFamily">
      <h3 [style.color]="settings.primaryColor">{{ settings.blogTitle }}</h3>
      <p>{{ settings.blogDescription }}</p>
      <span [style.background]="settings.accentColor" class="accent-sample">Tag exemplo</span>
    </div>
  </div>
</div>
