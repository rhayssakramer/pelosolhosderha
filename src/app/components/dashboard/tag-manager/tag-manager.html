<div class="tag-manager">
  <h1>🏷️ Gerenciar Tags</h1>

  <div class="add-tag">
    <input type="text" [(ngModel)]="newTagName" placeholder="Nome da tag" (keyup.enter)="addTag()">
    <button (click)="addTag()" class="btn-add">Adicionar</button>
  </div>

  <div class="tags-list">
    @for (tag of blog.tags(); track tag.id; let i = $index) {
      <div class="tag-item"
        draggable="true"
        (dragstart)="onDragStart(i)"
        (dragover)="onDragOver($event, i)"
        (dragleave)="onDragLeave()"
        (drop)="onDrop($event, i)"
        (dragend)="onDragEnd()"
        [class.dragging]="dragIndex === i"
        [class.drag-over]="dropIndex === i && dragIndex !== i">
        <span class="drag-handle" title="Arraste para reordenar">⠿</span>
        <span class="tag-preview" [style.background]="tag.color">{{ tag.name }}</span>
        <button (click)="deleteTag(tag.id)" class="btn-delete">✕</button>
      </div>
    } @empty {
      <p class="empty">Nenhuma tag criada ainda.</p>
    }
  </div>
</div>
