<div class="editor">
  <div class="editor-header">
    <h1>{{ isEditing ? 'Editar Postagem' : 'Nova Postagem' }}</h1>
  </div>

  <form (ngSubmit)="save()" class="editor-form">
    <div class="form-group">
      <label>Título</label>
      <input type="text" [(ngModel)]="title" name="title" placeholder="Título da postagem" required>
    </div>

    <div class="form-group">
      <label>Conteúdo</label>
      <div class="editor-wrapper">
        <quill-editor
          [(ngModel)]="content"
          name="content"
          [modules]="quillModules"
          placeholder="Escreva seu conteúdo aqui..."
          [styles]="{ height: '350px' }"
          (onEditorCreated)="onEditorCreated($event)">
        </quill-editor>
        <div class="emoji-container">
          <button type="button" class="btn-emoji-toggle" (click)="toggleEmojiPicker()">😊</button>
          @if (showEmojiPicker) {
            <div class="emoji-picker">
              @for (emoji of emojis; track emoji) {
                <button type="button" class="emoji-item" (click)="insertEmoji(emoji)">{{ emoji }}</button>
              }
            </div>
          }
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>Imagem de Capa</label>
      <div class="cover-upload">
        @if (coverPreview) {
          <div class="cover-preview">
            <img [src]="coverPreview" alt="Preview da capa">
            <button type="button" class="btn-remove-cover" (click)="removeCover()">✕ Remover</button>
          </div>
        } @else {
          <label class="upload-area" for="coverFile">
            <span class="upload-icon">📷</span>
            <span>Clique para selecionar uma imagem</span><br>
          </label>
        }
        <input type="file" id="coverFile" accept="image/*" (change)="onCoverFileChange($event)" hidden>
      </div>
    </div>

    <div class="form-group">
      <label>Tags</label>
      <div class="tags-selector">
        @for (tag of blog.tags(); track tag.id) {
          <button type="button"
            class="tag-btn"
            [class.selected]="selectedTags.includes(tag.name)"
            [style.--tag-color]="tag.color"
            (click)="toggleTag(tag.name)">
            {{ tag.name }}
          </button>
        } @empty {
          <span class="no-tags">Nenhuma tag criada. <a routerLink="/dashboard/tags">Criar tags</a></span>
        }
      </div>
    </div>

    <div class="form-actions">
      <label class="publish-toggle">
        <input type="checkbox" [(ngModel)]="published" name="published">
        Publicar imediatamente
      </label>
      <div class="action-buttons">
        <button type="button" (click)="router.navigate(['/dashboard'])" class="btn-cancel">Cancelar</button>
        <button type="submit" class="btn-save">{{ isEditing ? 'Salvar' : 'Criar' }}</button>
      </div>
    </div>
  </form>
</div>
