<div class="login-container">
  <div class="login-card">
    <h1>🔐 Área Admin</h1>
    <p class="subtitle">Pelos Olhos de Rha</p>

    @if (error()) {
      <div class="error-msg">{{ error() }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="seu@email.com" required>
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login">Entrar</button>
    </form>

    <a href="/" class="back-link">← Voltar ao blog</a>
  </div>
</div>
