name: Deploy Backend to Azure

on:
  push:
    branches:
      - main
      - homolog
    paths:
      - 'backend/**'

env:
  AZURE_WEBAPP_PACKAGE_PATH: 'backend'
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Prepare deployment package
        working-directory: backend
        run: |
          cp package.json dist/
          cp package-lock.json dist/
          cp -r prisma dist/
          cp -r node_modules dist/

      # Deploy to Production (main branch)
      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pelosolhosderha'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: backend/dist

      # Deploy to Homolog (homolog branch)
      - name: Deploy to Homolog
        if: github.ref == 'refs/heads/homolog'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pelosolhosderha-homolog'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_HOMOLOG }}
          package: backend/dist

      # Run migrations
      - name: Run Migrations (Production)
        if: github.ref == 'refs/heads/main'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: npx prisma migrate deploy

      - name: Run Migrations (Homolog)
        if: github.ref == 'refs/heads/homolog'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_HOMOLOG }}
        run: npx prisma migrate deploy
